[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-forge"
version = "0.1.0"
description = "Thermocline-compliant reference forge: computes pi to N digits"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0",
    "mpmath>=1.3",
    "thermocline>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
pi-forge = "pi_forge.__main__:main"

[tool.setuptools]
py-modules = ["server", "envelope", "pi", "forge_identity"]
packages = ["pi_forge"]

# ---------------------------------------------------------------------------
# mypy --strict on forges deferred to v0.2.
#
# A pre-v0.1 audit found ~20 type errors in pi-forge under `mypy --strict`
# (predominantly missing dict/list type-args in envelope.py helpers and
# missing return annotations on Flask route handlers). The current setting
# is intentionally NON-STRICT while the annotation work is queued for v0.2;
# see seamount/CHANGELOG.md "Known limitations" for the v0.1 disposition.
# Re-enable by uncommenting the `strict = true` line below.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
# strict = true  # v0.2 — forge annotation work pending
ignore_missing_imports = true
