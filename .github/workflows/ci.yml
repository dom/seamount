name: seamount CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cross-repo path resolution: tests + harness derive sibling-repo paths from
# THERMOCLINE_SUITE_ROOT. ${{ github.workspace }} is the directory that contains
# all sibling checkouts (seamount/, thermocline/, optionally photophore/).
env:
  THERMOCLINE_SUITE_ROOT: ${{ github.workspace }}

jobs:
  lint-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: seamount
      - uses: actions/checkout@v4
        with:
          repository: dom/thermocline
          path: thermocline
          # Sibling repo is private; default GITHUB_TOKEN is scoped to the
          # running repo only. SUITE_REPOS_TOKEN is a fine-grained PAT with
          # Contents: Read on dom/{thermocline,photophore,seamount}.
          token: ${{ secrets.SUITE_REPOS_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Print lint (CONF-06)
        working-directory: seamount
        run: python tools/ast_lint_no_print.py pi-forge/ describe-forge/ conformance/
      - name: AT coverage (seamount = AT-E*)
        working-directory: seamount
        run: python tools/at_coverage.py
      # mypy --strict on forges deferred to v0.2 (CONFLICT-04 option b).
      # See pi-forge/pyproject.toml and describe-forge/pyproject.toml
      # [tool.mypy] for the deferral rationale; the strict gate is queued
      # for v0.2 with a Known-limitation entry in seamount/CHANGELOG.md.

  forge-unit-tests:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        forge: [pi-forge, describe-forge]
    steps:
      - uses: actions/checkout@v4
        with:
          path: seamount
      - uses: actions/checkout@v4
        with:
          repository: dom/thermocline
          path: thermocline
          # Sibling repo is private; default GITHUB_TOKEN is scoped to the
          # running repo only. SUITE_REPOS_TOKEN is a fine-grained PAT with
          # Contents: Read on dom/{thermocline,photophore,seamount}.
          token: ${{ secrets.SUITE_REPOS_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install thermocline + forge
        run: |
          pip install -e thermocline/thermocline/python/
          pip install -e seamount/${{ matrix.forge }}/
          pip install pytest
      - name: Pytest ${{ matrix.forge }}
        working-directory: seamount/${{ matrix.forge }}
        run: pytest tests/ -q

  conformance:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        forge: [pi-forge, describe-forge]
    steps:
      - uses: actions/checkout@v4
        with:
          path: seamount
      - uses: actions/checkout@v4
        with:
          repository: dom/thermocline
          path: thermocline
          # Sibling repo is private; default GITHUB_TOKEN is scoped to the
          # running repo only. SUITE_REPOS_TOKEN is a fine-grained PAT with
          # Contents: Read on dom/{thermocline,photophore,seamount}.
          token: ${{ secrets.SUITE_REPOS_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Provision CI keychain
        # The login.keychain on headless macOS runners enforces ACLs that
        # block cross-process keyring reads, even after unlock — the /pubkey
        # handler in a forge subprocess hangs on an "allow access" dialog
        # that no human can dismiss. Create a fresh custom keychain with a
        # known password, set it as default, unlock it, and call
        # set-key-partition-list to allow tool-based access without prompts.
        # This is the standard CI pattern for macOS keychain access.
        run: |
          KC_PATH="${RUNNER_TEMP:-$HOME}/ci.keychain-db"
          KC_PASS="cipass"
          security create-keychain -p "$KC_PASS" "$KC_PATH"
          security set-keychain-settings -lut 7200 "$KC_PATH"
          security unlock-keychain -p "$KC_PASS" "$KC_PATH"
          # Make the new keychain the default + keep login.keychain on the
          # search list (some tooling expects it).
          security list-keychains -d user -s "$KC_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$KC_PATH"
          # Allow tool-based access without prompts.
          security set-key-partition-list -S apple-tool:,apple:,unsigned: -s -k "$KC_PASS" "$KC_PATH" 2>/dev/null || true
      - name: Install thermocline + forge + forge_conformance
        run: |
          pip install -e thermocline/thermocline/python/
          pip install -e seamount/${{ matrix.forge }}/
          pip install -e seamount/conformance/
          pip install flask
      - name: Init + serve + run forge_conformance against ${{ matrix.forge }}
        # Single step: GitHub Actions reaps backgrounded processes at step
        # boundary. Spawning `serve &` in one step and the harness in the next
        # leaves the harness pointing at a dead port. Keep the forge alive for
        # the lifetime of this step; trap-kill on exit.
        run: |
          MODULE=${{ matrix.forge == 'pi-forge' && 'pi_forge' || 'describe_forge' }}
          python -m "$MODULE" init --keyring-service seamount.ci-test
          python -m "$MODULE" serve --keyring-service seamount.ci-test --port 5100 &
          FORGE_PID=$!
          trap "kill $FORGE_PID 2>/dev/null || true" EXIT
          # Poll /pubkey for readiness (up to 30s for cold macOS arm64 starts).
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5100/pubkey >/dev/null; then
              echo "forge ready (pid=$FORGE_PID)"
              break
            fi
            sleep 0.5
          done
          python -m forge_conformance \
            --target http://127.0.0.1:5100 \
            --role ${{ matrix.forge }} \
            --output json

  forge-conformance-harness-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: seamount
      - uses: actions/checkout@v4
        with:
          repository: dom/thermocline
          path: thermocline
          # Sibling repo is private; default GITHUB_TOKEN is scoped to the
          # running repo only. SUITE_REPOS_TOKEN is a fine-grained PAT with
          # Contents: Read on dom/{thermocline,photophore,seamount}.
          token: ${{ secrets.SUITE_REPOS_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unlock macOS Keychain
        # Subprocess /pubkey handler blocks on Keychain unlock dialog without
        # this step on headless GH macOS runners. See conformance job for full
        # rationale.
        run: |
          security unlock-keychain -p "" "$HOME/Library/Keychains/login.keychain-db" || \
          security unlock-keychain -p "" login.keychain || true
          security set-keychain-settings -lut 7200 "$HOME/Library/Keychains/login.keychain-db" || true
      - name: Install thermocline + all forges + conformance
        run: |
          pip install -e thermocline/thermocline/python/
          pip install -e seamount/pi-forge/
          pip install -e seamount/describe-forge/
          pip install -e seamount/conformance/[dev]
          pip install flask
      - name: Init both forges (for harness test fixtures)
        run: |
          python -m pi_forge init --keyring-service seamount.piforge || true
          python -m describe_forge init --keyring-service seamount.describeforge || true
      - name: Run forge_conformance own tests
        working-directory: seamount/conformance
        run: pytest tests/ -q
