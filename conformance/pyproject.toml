[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge_conformance"
version = "0.1.0"
description = "Cross-suite conformance test harness for Thermocline forges (FORGE-04 / FORGE-05)."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Thermocline Suite contributors" },
]
dependencies = [
    "thermocline>=0.4.0",
    "httpx>=0.27",
    "jsonschema>=4.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
forge-conformance = "forge_conformance.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_conformance*"]

[tool.setuptools.package-data]
forge_conformance = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "at_negative"]
markers = [
    "at_surface(name): mark test as exercising a specific AT-* threat-model surface",
    "documents_only: marker for documents-only AT-* tests (no live runtime assertions)",
    "integration: marker for tests that spawn subprocess fixtures or hit network",
]
