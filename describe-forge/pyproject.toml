[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "describe-forge"
version = "0.1.0"
description = "Thermocline reference forge: templated descriptions of tier-1 shadows"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0",
    "thermocline>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
describe-forge = "describe_forge.__main__:main"

[tool.setuptools]
py-modules = ["server", "envelope", "describe", "forge_identity"]
packages = ["describe_forge"]

# ---------------------------------------------------------------------------
# mypy --strict on forges deferred to v0.2.
#
# A pre-v0.1 audit found ~17 type errors in describe-forge under
# `mypy --strict` (predominantly missing dict/list type-args in envelope.py
# helpers and missing return annotations on Flask route handlers). The
# current setting is intentionally NON-STRICT while the annotation work is
# queued for v0.2; see seamount/CHANGELOG.md "Known limitations" for the
# v0.1 disposition. Re-enable by uncommenting the `strict = true` line below.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
# strict = true  # v0.2 — forge annotation work pending
ignore_missing_imports = true
